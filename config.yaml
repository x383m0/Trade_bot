# ============================================================================
#  Trade_bot settings. After changing something marked (re-fetch) or (retrain),
#  rerun those steps. See COMMANDS.md for what to run.
# ============================================================================

# --- market ---
exchange: kraken          # where the bot trades (live/paper prices). Available in Canada.
data_exchange: coinbase   # where training history comes from (Kraken's API only returns ~720 candles)
symbol: BTC/USD           # the coin the bot TRADES (training data for it)              (re-fetch, retrain)
live_symbol: BTC/CAD      # pair used for paper/live trading on `exchange`. BTC/CAD = trade in Canadian
                          # dollars (no USD conversion fees). Same % moves as BTC/USD, so the model
                          # trained on USD data works. Set to BTC/USD to trade in USD.
train_symbols:            # coins it LEARNS from - more variety = less memorizing     (re-fetch, retrain)
  - BTC/USD
  - ETH/USD
  - SOL/USD
timeframe: 1h             # candle size: 5m / 15m / 1h. For 1h set years ~8           (re-fetch, retrain)
years: 8                  # history to download. 4 years includes bear markets (2022), not just bull runs (re-fetch, retrain)

# --- costs (what Kraken charges) ---
fee: 0.004                # 0.40% per side = taker (market order) fee, lowest tier. Used by market
                          # orders and stop-loss exits; limit orders pay orders.maker_fee   (retrain)
slippage: 0.0005          # 0.05% per side - price moving against you while filling   (retrain)
trade_penalty: 0.002      # extra TRAINING-ONLY penalty per trade -> teaches caution (retrain).
                          # Run 2: raised 10x from 0.0002 (run 1 made 450 trades)

# --- trading rules (apply to training, backtests and paper trading)                (retrain) ---
orders:
  type: limit             # market = instant, pays `fee` + `slippage`.
                          # limit  = order at the candle's close, pays `maker_fee`, but only fills
                          #          if the next candle trades through that price (can miss moves)
  maker_fee: 0.0025       # Kraken limit-order (maker) fee, lowest tier
  fill_margin: 0.0002     # limit fills only if price trades 0.02% THROUGH it (queue realism)
rules:
  min_hold: 0             # candles the bot must hold before it may sell (0 = off; e.g. 4 = 1h on 15m)
  stop_loss: 0.0          # sell at market if the open trade is down this much (0 = off; 0.05 = 5%)
reward:
  type: excess            # profit = make money | excess = beat buy & hold (stepping aside in a
                          #   crash scores, "just hold in a bull market" doesn't)
  drawdown_penalty: 0.0   # extra penalty when equity sinks below its peak (0 = off).
                          # WARNING: it punishes every dip while holding, so even 0.1 makes holding
                          # look worse than cash -> the bot learns to stay in cash. Keep 0 for now.

# --- data split (chronological, never shuffled) ---
split:
  train: 0.70             # agent learns from this
  val: 0.15               # "pop quiz": picks the best checkpoint
  test: 0.15              # "final exam": only look at it when you're done tuning

# --- training ---
train:
  algo: PPO
  total_timesteps: 500000 # training steps per seed. More = longer, often better (1-3M)  (retrain)
  seed: 42                # first seed; extra seeds are 43, 44, ...
  n_seeds: 3              # agents trained per run (python train.py --seeds N to override)
  parallel: 1             # seeds trained at the same time. On a strong CPU set it to n_seeds
                          # (or use python train.py --parallel 3) -> ~n_seeds times faster
  device: cpu             # cpu is fastest for this small network; a GPU only helps big models
  window: 16              # candles of history the agent sees each decision            (retrain)
  learning_rate: 0.0001   # how big each learning step is. Lower = slower but steadier  (retrain)
                          # Run 2: lowered from 0.0003 - in a test on a learnable pattern, 0.0003
                          # kept un-learning and over-trading; 0.0001 learned it and stayed stable
  gamma: 0.99             # how far ahead it plans (0.99 ~ 100 bars, 0.999 ~ 1000)      (retrain)
  ent_coef: 0.01          # exploration: higher = tries more random actions early       (retrain)

# --- ensemble: all seeds vote every candle ---
ensemble:
  enabled: true           # false = use only the single best seed
  vote: soft              # soft = average how confident the seeds are (one sure seed can outweigh
                          #        two unsure ones) | majority = strict yes/no vote (min_agree)
  margin: 0.0             # soft vote: buy above 50%+margin, sell below 50%-margin (e.g. 0.05 = calmer)
  min_agree: 0.5          # majority vote: share of agents that must agree (strictly more than)

# --- walk-forward test (python walkforward.py): train + test on several periods in a row ---
walkforward:
  folds: 6                # number of test periods
  start: 0.40             # periods cover 40%..85% of history; the last 15% (the normal
  end: 0.85               #   --split test) is never touched, so it stays the final exam
  timesteps: 300000       # training steps per seed per period (total = folds x seeds x this)

monkey_runs: 1000         # random traders to compare against in backtest.py

# --- paper trading ---
paper:
  starting_cash: 20       # fake USD
  replay_delay: 0.1       # seconds per candle in --replay mode

# {pair}, {timeframe}, {exchange}, {data_exchange} are filled in from the settings above,
# so 15m and 1h runs keep separate data, models and reports.
paths:
  data: data/{data_exchange}_{pair}_{timeframe}.parquet
  model: models/ppo_{pair}_{timeframe}
  report: reports/{timeframe}
